<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="keywords"
        content="Chedilex, chedix, software development, custom software, mobile apps, cybersecurity, data analytics, web development, software solutions">
    <meta name="description"
        content="Chedilex Software Solutions delivers innovative, scalable software development services including custom applications, web development, cybersecurity, and data analytics to drive business growth.">
    <meta name="author" content="Eng. Tony EL Chediac">
    <meta name="theme-color" content="#1d4ed8">
    <meta name="robots" content="index, follow">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Chedilex | Article</title>
    <link rel="icon" type="image/png" href="images/chedilex-logo-removebg.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="preconnect" href="https://unpkg.com">
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
</head>

<body>

    <!-- loader code -->
    <div class="loaderMain" id="loader">
        <div class="container no-animation">
            <div class="loader">
                <img src="images/chedilex.new.logo.jpeg" alt="logo">
            </div>
        </div>
    </div>

    <!-- back to top button -->
    <button id="backToTop" title="Go to top"><i class="fa-solid fa-arrow-up"></i></button>

    <!-- Particle Background -->
    <div id="particles-js"></div>

    <!-- Header & Navigation -->
    <header id="headerBack"></header>

    <!-- Article Hero / Header -->
    <section class="article-hero-section">
        <div class="container no-animation">
            <div class="article-hero-title">
                <h1 id="news-title-t">Loading Title...</h1>
                <div class="article-meta-badge" id="article-date-container">
                    <i class="far fa-calendar-alt"></i>
                    <span id="article-date-t">---</span>
                </div>
            </div>
        </div>
    </section>

    <!-- Main Content Body -->
    <main class="article-wrapper">
        <div class="container no-animation">
            <div id="article-content">
                <div class="article-loading">
                    <i class="fas fa-circle-notch fa-spin"></i>
                    <p>Loading article...</p>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer>
    </footer>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const urlParams = new URLSearchParams(window.location.search);
            const articleId = urlParams.get('id');
            const contentContainer = document.getElementById("article-content");

            if (!articleId) {
                contentContainer.innerHTML = `<div class="article-error"><p>Article not found.</p><a href="news.html" class="btn btn-outline"><i class="fas fa-arrow-left"></i> Return to News</a></div>`;
                return;
            }

            fetch("json/articles.json")
                .then(res => res.json())
                .then(data => {
                    const article = data.find(item => item.id == articleId);

                    if (article) {
                        const displayImage = (article.image && article.image.trim() !== "")
                            ? article.image
                            : 'images/chedilex.new.logo.jpeg';

                        const articleLink = (article.link && article.link.trim() !== "")
                            ? `
                                <div class="link-container">
                                    <a href="${article.link}" target="_blank" rel="noopener" class="article-external-btn">
                                        <span>Visit Associated Link</span>
                                        <i class="fa-solid fa-arrow-up-right-from-square"></i>
                                    </a>
                                </div>`
                            : "";

                        document.getElementById("news-title-t").textContent = article.title;
                        document.getElementById("article-date-t").textContent = article.day;

                        const formattedDescription = article.description.replace(/\n/g, "<br>");

                        contentContainer.innerHTML = `
                            <article class="article-card-main">
                                <div class="article-media-wrapper">
                                    <img src="${displayImage}" alt="${article.title || 'News'}" class="article-main-img">
                                </div>
                                <div class="full-article">
                                    <div class="full-description">${formattedDescription}</div>
                                    ${articleLink}
                                    <div class="published-footer">
                                        <p><i class="fas fa-newspaper"></i> Published by</p>
                                        <strong>Chedilex Social Media Team</strong>
                                    </div>
                                </div>
                            </article>
                        `;

                        document.title = `${article.title} | Chedilex`;
                    } else {
                        contentContainer.innerHTML = `<div class="article-error"><p>Article not found.</p><a href="news.html" class="btn btn-outline"><i class="fas fa-arrow-left"></i> Return to News</a></div>`;
                    }
                })
                .catch(error => {
                    console.error("Error fetching article:", error);
                    contentContainer.innerHTML = `<div class="article-error"><p>Unable to load article content.</p><a href="news.html" class="btn btn-outline"><i class="fas fa-arrow-left"></i> Return to News</a></div>`;
                });
        });
    </script>

    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/typed.js@2.0.6"></script>
    <script src="js/script.js"></script>
    <script src="js/header.js"></script>
    <script src="js/footer.js"></script>
    <script src="js/particles.js"></script>
</body>

</html>
