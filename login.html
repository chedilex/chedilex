<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="keywords"
        content="Chedilex, chedix, software development, custom software, mobile apps, cybersecurity, data analytics, web development, software solutions">
    <meta name="description"
        content="Chedilex Software Solutions delivers innovative, scalable software development services including custom applications, web development, cybersecurity, and data analytics to drive business growth.">
    <meta name="author" content="Eng. Tony EL Chediac">
    <meta name="theme-color" content="#1d4ed8">
    <meta name="robots" content="index, follow">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Chedilex | Login</title>
    <link rel="icon" type="image/png" href="images/chedilex-logo-removebg.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="preconnect" href="https://unpkg.com">
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
</head>

<body>

    <!-- loader code -->
    <div class="loaderMain" id="loader">
        <div class="container ">
            <div class="loader">
                <img src="images/chedilex.new.logo.jpeg" alt="logo">
            </div>
        </div>
    </div>

    <!-- back to top button -->
    <button id="backToTop" title="Go to top"><i class="fa-solid fa-arrow-up"></i></button>

    <!-- Particle Background -->
    <div id="particles-js"></div>

    <!-- Header & Navigation -->
    <header id="headerBack"></header>

    <!-- login form -->
    <section class="section" id="login">
        <div class="container ">
            <div class="pagehero-content">
                <div class="section-title">
                    <h2>Login</h2>
                    <p>Login to access your dashboard and manage your data.</p>
                </div>
            </div>
            <div class="login-form">
                <form action="#" method="post">
                    <input type="text" name="username" id="username" placeholder="Username" required>
                    <input type="password" name="password" id="password" placeholder="Password" required>
                    <div class="extrabtn">
                        <input type="submit" value="Login">
                        <a href="#" class="forget-password">Forget Password?</a>
                    </div>
                </form>
                <div class="registerbtn">
                    <p>Don't have an account? <button id="requestAccountBtn" onclick="toggleRequestAccount()">Request
                            Here.</button></p>
                </div>
            </div>
        </div>
    </section>

    <!-- request account section -->
    <section class="section" id="requestAccount">
        <div class="container ">
            <div class="pagehero-content">
                <div class="section-title">
                    <h2>Request Account</h2>
                    <p>Create an account to get in touch with us.</p>
                </div>
            </div>
            <div class="login-form">
                <form action="#" method="post">
                    <input type="text" name="firstname" id="firstname" placeholder="Your First Name" required>
                    <input type="text" name="lastname" id="lastname" placeholder="Your Last Name" required>
                    <input type="email" name="email" id="email" placeholder="Your Email" required>
                    <input type="password" name="password" id="password" placeholder="Password" required>
                    <input type="password" name="confirmPassword" id="confirmPassword" placeholder="Confirm Password"
                        required>
                    <input type="text" name="chedilexAccountNumber" id="chedilexAccountNumber"
                        placeholder="Chedilex Account Number" required>
                    <input type="number" name="contact" id="contact" placeholder="Your Contact" required>

                    <input type="submit" value="Create Account">
                </form>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer>
    </footer>

    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/typed.js@2.0.6"></script>
    <script src="js/script.js"></script>
    <script src="js/header.js"></script>
    <script src="js/footer.js"></script>
    <script src="js/particles.js"></script>
    <script>
        function toggleRequestAccount() {
            document.getElementById("login").style.display = "none";
            document.getElementById("requestAccount").style.display = "block";
        }
    </script>
</body>

</html>
